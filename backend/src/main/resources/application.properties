spring.application.name=ticketmanager
server.port=${PORT:8080}

# Database PostgreSQL (in produzione i valori arrivano dalle variabili d'ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketmanager}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Autenticazione
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.jwt.secret=${JWT_SECRET:chiave-segreta-di-sviluppo-lunga-almeno-32-caratteri}
app.jwt.expiration=8h

# Origini autorizzate a chiamare le API (separate da virgola)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
