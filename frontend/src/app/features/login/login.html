<main class="login-page">
  <mat-card class="login-card" appearance="outlined">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }
    <mat-card-header>
      <mat-icon mat-card-avatar class="logo">support_agent</mat-icon>
      <mat-card-title>Ticket Manager</mat-card-title>
      <mat-card-subtitle>Accesso amministratore</mat-card-subtitle>
    </mat-card-header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-card-content>
        @if (error()) {
          <div class="error-box" role="alert">
            <mat-icon>error</mat-icon>
            <span>{{ error() }}</span>
          </div>
        }

        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          @if (form.controls.username.hasError('required')) {
            <mat-error>Lo username è obbligatorio</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            formControlName="password"
            [type]="hidePassword() ? 'password' : 'text'"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            [attr.aria-label]="hidePassword() ? 'Mostra password' : 'Nascondi password'"
          >
            <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          @if (form.controls.password.hasError('required')) {
            <mat-error>La password è obbligatoria</mat-error>
          }
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions>
        <button mat-flat-button type="submit" [disabled]="loading()">Accedi</button>
      </mat-card-actions>
    </form>
  </mat-card>
</main>
